name: Kit acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pytest setuptools wheel
      - name: Behavioral acceptance and runner fixtures
        env:
          AEK_REQUIRE_PROFILES: '1'
        run: python -m unittest discover -s tests -v
      - run: python scripts/sync_bundle.py --check
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
