[project]
name = "agentic-engineering-kit"
version = "0.1.0"
description = "Approved harnesses and evidence-based workflows for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aek = "aek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
